name: Build Repo Listing

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'source.json'
      - 'src/**'
      - 'public/**'
      - 'Website/**'
      - 'scripts/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tsconfig.json'
      - 'vite.config.ts'
      - '.github/workflows/build-listing.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-listing:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: vrchat-community/package-list-action
          path: ci
          clean: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Install website dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate package listing
        run: >-
          dotnet run --project ci/PackageBuilder/PackageBuilder.csproj
          --framework net8.0 --
          BuildMultiPackageListing --host Terminal
          --root "$GITHUB_WORKSPACE/ci"
          --package-listing-source-folder "$GITHUB_WORKSPACE"
          --list-publish-directory "$GITHUB_WORKSPACE/.preview"

      - name: Include VPM index in website
        run: cp .preview/index.json public/index.json

      - name: Build website
        run: pnpm build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4